name: DevSecOps - Security Gate (Homolog)

# ============================================================
# PIPELINE 2 - SECURITY GATE
#
# Disparada pela Pipeline 1 via workflow_dispatch.
#
# Novo fluxo com repositórios externos:
#   1. Recebe TARGET_REPO_URL via input
#   2. Clona o repositório alvo na branch fix-remediation
#   3. Executa Trivy + Smoke test
#   4. Registra resultado no Supabase
#   5. Se aprovado: abre PR fix-remediation → homolog no repo alvo
#
# A Pipeline 1 passa os parâmetros:
#   - target_repo_url: URL do repositório legado
#   - target_branch: branch com as correções (fix-remediation)
# ============================================================

on:
  workflow_dispatch:
    inputs:
      target_repo_url:
        description: 'URL do repositório legado alvo'
        required: true
      target_branch:
        description: 'Branch a ser validada'
        required: true
        default: 'fix-remediation'

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:

  security-gate:

    name: 🧪 Re-scan e Validação da Remediação

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # FASE 0: CHECKOUT DO REPOSITÓRIO ALVO
      # ==========================================================

      - name: Clonar repositório legado (branch corrigida)
        run: |
          REPO_URL="${{ github.event.inputs.target_repo_url }}"
          BRANCH="${{ github.event.inputs.target_branch }}"
          echo "📦 Clonando: $REPO_URL (branch: $BRANCH)"
          git clone --depth 1 --branch "$BRANCH" "$REPO_URL" /tmp/target-repo
          echo "TARGET_PATH=/tmp/target-repo" >> "$GITHUB_ENV"
          echo "TARGET_REPO_URL=$REPO_URL" >> "$GITHUB_ENV"
          echo "TARGET_BRANCH=$BRANCH" >> "$GITHUB_ENV"
          echo "✅ Repositório clonado em /tmp/target-repo"

      # ==========================================================
      # FASE 1: INSTALAÇÃO DO TRIVY
      # ==========================================================

      - name: Instalar Trivy
        run: |
          sudo apt-get install -y wget gnupg lsb-release --quiet
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y trivy
          trivy --version

      # ==========================================================
      # FASE 1.1: RE-SCAN DE SEGURANÇA
      # ==========================================================

      - name: Re-scan Trivy
        id: trivy
        continue-on-error: true
        run: |
          set +e
          echo "🔍 Iniciando re-scan de segurança"
          echo "📌 Repositório: ${{ github.event.inputs.target_repo_url }}"
          echo "📌 Branch: ${{ github.event.inputs.target_branch }}"

          trivy fs /tmp/target-repo \
            --format table \
            --severity CRITICAL,HIGH \
            --exit-code 1

          TRIVY_EXIT_CODE=$?
          echo "TRIVY_EXIT_CODE=$TRIVY_EXIT_CODE" >> "$GITHUB_ENV"

          if [ "$TRIVY_EXIT_CODE" -eq 0 ]; then
            echo "=========================================="
            echo "✅ Nenhuma vulnerabilidade CRITICAL/HIGH"
            echo "=========================================="
          else
            echo "=========================================="
            echo "❌ Vulnerabilidades CRITICAL/HIGH persistem"
            echo "=========================================="
          fi
          exit 0

      # ==========================================================
      # FASE 1.2: REGISTRO DO RESULTADO
      # ==========================================================

      - name: Registrar resultado do Trivy
        run: |
          if [ "${TRIVY_EXIT_CODE}" = "0" ]; then
            echo "✅ Security Gate: APROVADO"
          else
            echo "❌ Security Gate: REJEITADO"
          fi

      # ==========================================================
      # FASE 2: SMOKE TEST PHP
      # ==========================================================

      - name: Smoke test PHP
        if: hashFiles('/tmp/target-repo/composer.json') != '' || hashFiles('/tmp/target-repo/*.php') != ''
        run: |
          echo "📦 Projeto PHP detectado"

          sudo apt-get install -y php-cli php-curl php-mbstring php-xml --quiet

          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
          composer --version

          if [ -f "/tmp/target-repo/composer.json" ]; then
            composer install --no-interaction --no-progress --prefer-dist --working-dir=/tmp/target-repo
          fi

          PHP_FILES=$(find /tmp/target-repo -type f -name "*.php" -not -path "*/vendor/*" -not -path "*/.git/*")
          if [ -n "$PHP_FILES" ]; then
            echo "$PHP_FILES" | while read -r file; do
              php -l "$file" && echo "✅ $file: sintaxe OK"
            done
          else
            echo "ℹ️ Nenhum arquivo PHP encontrado"
          fi

      # ==========================================================
      # FASE 3: SMOKE TEST BÁSICO
      # ==========================================================

      - name: Smoke test básico
        run: |
          echo "🔍 Validando estrutura do projeto"
          TOTAL_FILES=$(find /tmp/target-repo -type f -not -path '*/.git/*' -not -path '*/vendor/*' | wc -l)
          echo "📁 Total de arquivos: $TOTAL_FILES"
          if [ "$TOTAL_FILES" -eq 0 ]; then
            echo "❌ Nenhum arquivo encontrado"
            exit 1
          fi
          echo "✅ Estrutura do projeto íntegra"

      # ==========================================================
      # FASE 4: ATUALIZAÇÃO DO SUPABASE
      # ==========================================================

      - name: Registrar resultado no Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SSLMODE: require
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          pip install psycopg2-binary python-dotenv --quiet
          python - <<'EOF'
          import sys, os
          sys.path.insert(0, "scripts")
          from db import connect_db

          conn = connect_db()
          cur = conn.cursor()

          trivy_exit = os.environ.get("TRIVY_EXIT_CODE", "1")
          workflow_run_id = os.environ.get("GITHUB_RUN_ID")
          target_repo = os.environ.get("TARGET_REPO_URL", "unknown")

          print(f"🔎 Repositório: {target_repo}")
          print(f"🔎 Resultado Trivy: {trivy_exit}")

          if trivy_exit == "0":
              print("✅ Security Gate aprovado")
              # Cria nova execução no Supabase para este security gate
              cur.execute("""
                  INSERT INTO pipeline_executions
                      (repository_name, workflow_run_id, status, homolog_status, vulnerabilities_found, vulnerabilities_resolved, finished_at)
                  VALUES (%s, %s, 'SUCCESS', 'VALIDATED', 0, 0, NOW())
                  RETURNING id
              """, (target_repo, workflow_run_id))
              conn.commit()
              print(f"✅ Registro de validação criado no Supabase")
          else:
              print("❌ Security Gate rejeitado")
              cur.execute("""
                  INSERT INTO pipeline_executions
                      (repository_name, workflow_run_id, status, homolog_status, vulnerabilities_found, vulnerabilities_resolved, finished_at)
                  VALUES (%s, %s, 'FAILED', 'REJECTED', 0, 0, NOW())
                  RETURNING id
              """, (target_repo, workflow_run_id))
              conn.commit()
              print("❌ Rejeição registrada no Supabase")

          conn.close()
          print("✅ Supabase atualizado")
          EOF

      # ==========================================================
      # FASE 5: CRIAÇÃO DO PR PARA HOMOLOG
      #
      # Executa SOMENTE se o Trivy validou (TRIVY_EXIT_CODE=0).
      # Cria PR no REPOSITÓRIO ALVO: fix-remediation → homolog
      # ==========================================================

      - name: Criar Pull Request para homolog (repositório alvo)
        if: env.TRIVY_EXIT_CODE == '0'
        env:
          GH_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
        run: |
          REPO_URL="${{ github.event.inputs.target_repo_url }}"
          BRANCH="${{ github.event.inputs.target_branch }}"

          # Extrai owner/repo da URL
          REPO_FULL=$(echo "$REPO_URL" | sed 's|https://github.com/||' | sed 's|\.git$||' | sed 's|git@github.com:||')

          echo "🔎 Verificando se já existe PR no repositório alvo"
          echo "📌 Repositório: $REPO_FULL"
          echo "📌 Head: $BRANCH"
          echo "📌 Base: homolog"

          EXISTING_PR=$(gh pr list \
            --repo "$REPO_FULL" \
            --base homolog \
            --head "$BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING_PR" ]; then
            echo "ℹ️ PR já existe: #$EXISTING_PR"
            echo "ℹ️ Nenhum novo PR será criado"
            exit 0
          fi

          echo "🚀 Criando PR $BRANCH → homolog no repositório alvo"

          gh pr create \
            --repo "$REPO_FULL" \
            --base homolog \
            --head "$BRANCH" \
            --title "chore: remediação validada - promover para homolog" \
            --body "## 🔒 Remediação validada automaticamente

          A branch \`$BRANCH\` passou pelo Security Gate.

          ### Validações executadas
          - ✅ Re-scan Trivy
          - ✅ Nenhuma vulnerabilidade CRITICAL ou HIGH persistente
          - ✅ Smoke test executado
          - ✅ Estrutura do projeto validada
          - ✅ Resultado registrado no Supabase

          ### Próximo passo
          Aprovar o merge para homolog." \
          && echo "✅ PR criado com sucesso no repositório alvo" \
          || echo "⚠️  Não foi possível criar PR automática"